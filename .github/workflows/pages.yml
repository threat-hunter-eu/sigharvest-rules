name: Pages (search site)

# Builds the static search site from a rules-* release of THIS repository and deploys it to GitHub Pages.
# The release is published by the nightly workflow of threat-hunter-eu/sigharvest (GitHub App token, so the
# `release: published` event fires here). The site is built with the sigharvest commit that built the release
# (build-info.json), after checking that the commit is on sigharvest's main branch. This repository builds nothing
# else and holds no secrets.
#
# Off until the repository variable PAGES_ENABLED is 'true' and Settings -> Pages -> Source is "GitHub Actions".
# The github-pages environment must allow the tag pattern rules-* (release events run on the tag ref) and main
# (manual runs).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (empty = newest rules-* release).
        type: string
        default: ''

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # The only repository whose commits may build this site.
  TOOL_REPO: threat-hunter-eu/sigharvest

jobs:
  build:
    if: >-
      vars.PAGES_ENABLED == 'true' &&
      (github.event_name != 'release' || startsWith(github.event.release.tag_name, 'rules-'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      # A Pages site is public: deploy only when the API says this repository is public (fail-closed).
      - name: Repository visibility (fail-closed)
        run: |
          set -uo pipefail
          if private=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private' 2>/dev/null) && [ "$private" = "false" ]; then
            echo "repository is public"
          else
            echo "::error::repository not verified public (API private=${private:-<error>}): no Pages deploy"
            exit 1
          fi

      - name: Download the release and find the tool commit that built it
        id: rel
        run: |
          set -euo pipefail
          tag="${TAG:-}"
          if [ -z "$tag" ]; then
            tag=$(gh release list --limit 100 --exclude-drafts --json tagName \
                  --jq '[.[] | select(.tagName | startswith("rules-"))][0].tagName // ""')
          fi
          [[ "$tag" =~ ^rules-[0-9]{4}-[0-9]{2}-[0-9]{2}(\.[0-9]+)?$ ]] || { echo "::error::not a rules-* tag: '$tag'"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          gh release download "$tag" -D rel
          (cd rel && sha256sum --check SHA256SUMS)
          # build-info.json is not in SHA256SUMS: trust only a commit of TOOL_REPO that is on its main branch.
          mv rel/build-info.json "$RUNNER_TEMP/build-info.json"
          repo=$(jq -r '.tool_repo // ""' "$RUNNER_TEMP/build-info.json")
          sha=$(jq -r '.tool_commit // ""' "$RUNNER_TEMP/build-info.json")
          [ "$repo" = "$TOOL_REPO" ] || { echo "::error::release built by '$repo', expected $TOOL_REPO"; exit 1; }
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad tool commit '$sha'"; exit 1; }
          status=$(gh api "repos/$TOOL_REPO/compare/$sha...main" --jq '.status')
          case "$status" in
            ahead|identical) echo "tool commit $sha is on $TOOL_REPO main ($status)" ;;
            *) echo "::error::tool commit $sha is not on $TOOL_REPO main ($status)"; exit 1 ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # Release time, not build time: identical input -> identical site.
          echo "epoch=$(date -u -d "$(jq -r .created rel/manifest.json)" +%s)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TOOL_REPO }}
          ref: ${{ steps.rel.outputs.sha }}
          path: tool
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.6' # uv itself; bump with the action (checksum known to it)
          python-version: '3.12'
          enable-cache: false # deploy job: no cache restored from other runs

      - run: uv sync --locked --no-dev
        working-directory: tool

      - name: Read Pages configuration (fails clearly if Pages is not enabled)
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: false

      - name: Build site
        working-directory: tool
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          ORIGIN: ${{ steps.pages.outputs.origin }}
          BUILD_EPOCH: ${{ steps.rel.outputs.epoch }}
        run: |
          set -euo pipefail
          uv run --no-sync sigharvest site build ../_site \
            --release ../rel \
            --base-url "${BASE_PATH%/}/" \
            --site-url "$ORIGIN" \
            --build-epoch "$BUILD_EPOCH"
          du -sh ../_site
          echo "files: $(find ../_site -type f | wc -l)"
          big=$(find ../_site -type f -size +95M)
          [ -z "$big" ] || { echo "::error::files over the 100 MB Pages limit: $big"; exit 1; }

      # `sigharvest site build OUT --base-url /X/` writes the pages to OUT/X/ (docs/site.md): the Pages artifact root
      # is that folder, served at /X/ (project site). With a custom domain base_path is empty and this is _site.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site${{ steps.pages.outputs.base_path }}
          include-hidden-files: true # .well-known/security.txt (RFC 9116)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
